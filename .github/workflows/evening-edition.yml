name: Evening edition

# Free alternative to an always-on worker: runs the IST pipeline on GitHub's runners.
# Primary trigger: an external scheduler (e.g. cron-job.org) calls workflow_dispatch at 19:50 IST,
# because GitHub's own schedule is best-effort and can start hours late at busy times.
# The schedules below are backups (UTC; 13:47 = 19:17 IST). A run that starts early waits
# for 20:00 IST; one that finds the work done exits at once. Every stage is idempotent.
on:
  schedule:
    - cron: "47 13 * * *"
    - cron: "23 14 * * *"
    - cron: "7 15 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "run = evening pipeline / queued jobs; check = test every AI provider and image generation; illustrate = add images to articles without one; reillustrate = replace images on recent articles (current image style)"
        type: choice
        options: [run, check, illustrate, reillustrate]
        default: run

concurrency:
  group: evening-edition
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      INTERNAL_JOB_SECRET: ${{ secrets.INTERNAL_JOB_SECRET }}
      # Ordered fallback chain; providers without a key are skipped.
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'anthropic' }}
      LLM_PROVIDERS: ${{ vars.LLM_PROVIDERS }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODELS: ${{ vars.OPENROUTER_MODELS || 'nvidia/nemotron-3.5-super-vl:free,xingchen-agi/xing4.0-29b-a4b:free,dots-studio/dots-3-note-preview:free' }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: ${{ vars.GROQ_MODEL }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      XAI_MODEL: ${{ vars.XAI_MODEL }}
      # AI illustrations (Cloudflare Workers AI free allocation); SVG covers when unset.
      IMAGE_PROVIDER: ${{ vars.IMAGE_PROVIDER || 'none' }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      EMAIL_TRANSPORT: ${{ secrets.RESEND_API_KEY != '' && 'resend' || 'log' }}
      EMAIL_FROM: ${{ vars.EMAIL_FROM || 'The Daily Circuit <no-reply@the-daily-circuit.vercel.app>' }}
      ADMIN_ALERT_EMAILS: ${{ vars.ADMIN_ALERT_EMAILS }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://the-daily-circuit.vercel.app' }}
      WEB_INTERNAL_URL: ${{ vars.SITE_URL || 'https://the-daily-circuit.vercel.app' }}
      CLAUDE_WRITER_MODEL: claude-sonnet-5-5
      CLAUDE_CLASSIFIER_MODEL: claude-haiku-5-5
      MARKET_DATA_PROVIDER: none
      DATABASE_POOL_MAX: "5"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --workspace @tdc/worker --workspace @tdc/core --workspace @tdc/db --include-workspace-root
      - run: npm run db:deploy
      - run: npm run build:worker
      - name: Run the evening pipeline
        if: ${{ github.event_name == 'schedule' || inputs.mode == 'run' || inputs.mode == '' }}
        run: node apps/worker/dist/run-window.js
      - name: Maintenance (${{ inputs.mode }})
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.mode == 'check' || inputs.mode == 'illustrate' || inputs.mode == 'reillustrate') }}
        run: node apps/worker/dist/maintenance.js ${{ inputs.mode }}
